<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Clone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="navbar">
            <div class="navlogo border">
                <div class="logo"></div>
            </div>
            <div class="navaddress border">
                <p class="add1">Deliver to</p>
                <div class="addressicon">
                    <i class="fa-solid fa-location-dot"></i>
                    <p class="add2">India</p>
                </div>
            </div>
            <div class="navsearch">
                <input placeholder="Search Amazon" class="searchinput">
                <div class="searchicon">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
            </div>
            <div class="navsignin border">
                <p><span>Hello, sign in</span></p>
                <p class="navsecond">Accounts & Lists</p>
            </div>
            <div class="navcart border">
                <i class="fa-solid fa-cart-shopping"></i>
                <p>Cart (<span id="cart-count">0</span>)</p>
            </div>
        </div>
    </header>

    <div class="shopsection">
        <div class="box" data-name="Clothes" data-price="999">
            <h2>Clothes</h2>
            <div class="boximg" style="background-image: url('box1_image.jpg');"></div>
            <button class="add-to-cart">Add to Cart</button>
        </div>
        <div class="box" data-name="Electronics" data-price="4999">
            <h2>Electronics</h2>
            <div class="boximg" style="background-image: url('box4_image.jpg');"></div>
            <button class="add-to-cart">Add to Cart</button>
        </div>
    </div>

    <div class="popup">
        <div class="popup-content">
            <span class="close-btn">&times;</span>
            <h2>Product Details</h2>
            <p class="product-name"></p>
            <p class="product-price"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
